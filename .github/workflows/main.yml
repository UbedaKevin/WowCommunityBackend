name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wowcommunity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wowcommunity_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Conventional Commitlint
        uses: opensource-nepal/commitlint@v1
        continue-on-error: false

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U postgres \
            -d wowcommunity_test \
            -f schema.sql

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: wowcommunity_test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: node --test